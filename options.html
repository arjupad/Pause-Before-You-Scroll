<!doctype html>
<html lang="en">
<head>
  <!-- Settings page, opened from the toolbar icon or chrome://extensions > Details > Extension options. -->
  <meta charset="utf-8">
  <title>Pause Before You Scroll: settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Dark theme matching the breathing overlay. */
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 48px 20px; background: #0c1a2b; color: #dce8f2;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 520px; margin: 0 auto; }
    h1 { font-weight: 300; font-size: 30px; margin: 0 0 32px; }
    h2 { font-weight: 600; font-size: 17px; margin: 32px 0 6px; }
    p.note { margin: 0 0 14px; color: #8fb3cc; font-size: 14px; }
    ul { list-style: none; margin: 0 0 14px; padding: 0; }
    li {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 9px 14px; margin-bottom: 6px; border-radius: 10px; background: #14283d;
      overflow-wrap: anywhere;
    }
    li.empty { color: #8fb3cc; justify-content: flex-start; }
    form { display: flex; gap: 8px; }
    input {
      font: inherit; color: inherit; background: #14283d; border: 1px solid #2c4660;
      border-radius: 10px; padding: 8px 12px; min-width: 0;
    }
    input[type="text"] { flex: 1; }
    input[type="number"] { width: 90px; }
    input:focus-visible, button:focus-visible { outline: 2px solid #7fc4d8; outline-offset: 2px; }
    button {
      font: inherit; border-radius: 10px; padding: 8px 16px; cursor: pointer;
      border: 1px solid transparent; background: #7fc4d8; color: #0c1a2b; font-weight: 600;
    }
    button.remove {
      background: transparent; color: #a9c2d6; border-color: #2c4660; font-weight: 400;
      padding: 4px 12px; font-size: 14px; flex: none;
    }
    button.remove:hover { background: #1d3650; }
    label.inline { display: flex; align-items: center; gap: 10px; }
    #status { min-height: 1.5em; margin-top: 12px; font-size: 14px; color: #8fb3cc; }
    #status.error { color: #f0a59a; }
  </style>
</head>
<body>
  <main>
    <h1>Pause Before You Scroll</h1>

    <!-- Blocked sites: the list is filled in by options.js. -->
    <h2>Blocked sites</h2>
    <p class="note">Subdomains are included: <code>youtube.com</code> also covers <code>m.youtube.com</code>.</p>
    <ul id="domains"></ul>
    <form id="add-form">
      <input id="new-domain" type="text" placeholder="example.com" aria-label="Site to block" autocomplete="off" spellcheck="false">
      <button type="submit">Add</button>
    </form>

    <!-- Pass length: minutes a "Continue" pass lasts. -->
    <h2>Pass length</h2>
    <p class="note">How long "Continue" lets you use a site before the pause comes back.</p>
    <label class="inline">
      <input id="pass-minutes" type="number" min="1" max="1440" step="1">
      minutes
    </label>

    <!-- Confirmation and error messages appear here. -->
    <div id="status" role="status"></div>
  </main>
  <!-- shared.js provides the defaults and domain helpers; options.js runs the page. -->
  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
